<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FAQ — Star Portrait Posters</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0b0d12; --panel:#151822; --panel2:#1a1d28; --border:#2a2e3a; --text:#eef0f3; --muted:#9aa0ac;
    --accent:#6ea8fe; --accent-ink:#07101f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text);
    line-height:1.6;
  }
  .wrap{ max-width:760px; margin:0 auto; padding:0 20px 100px; }
  a{ color:var(--accent); }

  header.top{ padding:44px 0 8px; }
  header.top a.back{ font-size:13px; color:var(--muted); border-bottom:none; }
  header.top h1{ font-size:30px; margin:14px 0 8px; }
  header.top p.lead{ color:var(--muted); font-size:14px; margin:0 0 8px; max-width:520px; }

  .faq-list{ margin-top:28px; }
  details.faq-item{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:0; margin-bottom:12px; overflow:hidden;
  }
  details.faq-item summary{
    padding:16px 20px; cursor:pointer; font-size:15.5px; font-weight:600; list-style:none;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
  }
  details.faq-item summary::-webkit-details-marker{ display:none; }
  details.faq-item summary .chev{ color:var(--muted); flex-shrink:0; transition:transform .15s; font-size:13px; }
  details.faq-item[open] summary .chev{ transform:rotate(180deg); }
  details.faq-item .answer{ padding:0 20px 18px; color:var(--muted); font-size:14.5px; white-space:pre-line; }

  .empty{ color:var(--muted); text-align:center; padding:60px 0; }
  footer.doc-footer{ color:var(--muted); font-size:12px; text-align:center; padding:40px 0; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <a class="back" href="index.html">← Back to Star Portrait Posters</a>
    <h1>Frequently asked questions</h1>
    <p class="lead">Can't find what you're looking for? Reach out and we're happy to help.</p>
  </header>

  <div class="faq-list" id="faqList">
    <div class="empty">Loading…</div>
  </div>

  <footer class="doc-footer">Star Portrait Posters — <a href="index.html">back to the order page</a></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>
(function(){
  const supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  const faqList = document.getElementById('faqList');

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  }

  async function loadFaqs(){
    const { data, error } = await supabase
      .from('faqs')
      .select('*')
      .order('sort_order', { ascending: true })
      .order('created_at', { ascending: true });

    if(error){
      faqList.innerHTML = '<div class="empty">Could not load the FAQ right now — please try again shortly.</div>';
      return;
    }
    if(!data.length){
      faqList.innerHTML = '<div class="empty">No questions posted yet — check back soon.</div>';
      return;
    }
    faqList.innerHTML = data.map((faq, i) => `
      <details class="faq-item"${i === 0 ? ' open' : ''}>
        <summary>${escapeHtml(faq.question)}<span class="chev">▾</span></summary>
        <div class="answer">${escapeHtml(faq.answer)}</div>
      </details>
    `).join('');
  }

  loadFaqs();
})();
</script>
</body>
</html>
